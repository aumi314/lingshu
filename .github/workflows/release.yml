# main 上 CI 通过后构建成品，发布到滚动预发布 main-latest；DMIT 每分钟拉取清单自行部署（deploy/deploy/lingshu-dmit-deploy）。
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: 构建并发布 main-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 只发布 main 的最新提交
        run: |
          latest=$(git rev-parse origin/main)
          if [ "$latest" != "$SHA" ]; then
            echo "main 已前进到 $latest，跳过 $SHA，由更新的那次 CI 发布"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: 自上次发布以来只改了文档、许可证、CI 配置或服务器脚本就不发布（成品嵌提交号，否则每次都会触发一次无谓的重启）
        if: env.SKIP != '1'
        run: |
          prev=$(curl -fsSL --retry 3 https://github.com/${{ github.repository }}/releases/download/main-latest/manifest.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])' || true)
          if [ -n "$prev" ] && git cat-file -e "$prev^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$prev" "$SHA")
            # deploy/ 是手动装到服务器上的脚本和配置，不进成品
            others=$(echo "$changed" | grep -vE '^(docs/|\.github/|deploy/|LICENSE$)|\.md$' || true)
            if [ -n "$changed" ] && [ -z "$others" ]; then
              echo "自 ${prev:0:7} 以来只改了：" && echo "$changed"
              echo "SKIP=1" >> "$GITHUB_ENV"
            fi
          fi
      - name: 构建
        if: env.SKIP != '1'
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build
          touch web/dist/.gitkeep
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=true -trimpath -ldflags='-s -w' -o lingshu ./cmd/lingshu
      - name: 生成清单（全部迁移、破坏性迁移、成品哈希）
        if: env.SKIP != '1'
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, datetime
          migrations = sorted(p.name for p in pathlib.Path('internal/store/migrations').glob('*.sql'))
          # 会丢数据的迁移视为破坏性：回滚要恢复备份，必须有人确认（去掉 SQL 注释后判断）。
          # 删表、删列（Postgres 的 DROP 可省略 COLUMN，所以按排除法）、TRUNCATE、DELETE FROM 算；
          # 删约束、索引、默认值、NOT NULL、触发器、视图、函数不丢数据，不算
          harmless_drop = r'CONSTRAINT|INDEX|DEFAULT|NOT\s+NULL|TRIGGER|VIEW|FUNCTION|IDENTITY|EXPRESSION'
          def destructive(name):
              sql = pathlib.Path('internal/store/migrations', name).read_text()
              sql = re.sub(r'--[^\n]*', '', sql)
              return re.search(rf'\bDROP\s+(?!(?:{harmless_drop})\b)|\bTRUNCATE\b|\bDELETE\s+FROM\b', sql, re.I) is not None
          manifest = {
              'commit': os.environ['SHA'],
              'sha256': hashlib.sha256(pathlib.Path('lingshu').read_bytes()).hexdigest(),
              'built_at_utc': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'build': subprocess.run(['go', 'version'], capture_output=True, text=True).stdout.strip() + ', node ' + subprocess.run(['node', '--version'], capture_output=True, text=True).stdout.strip() + ', linux/amd64 CGO_ENABLED=0',
              'migrations': [m.removesuffix('.sql') for m in migrations],
              'destructive_migrations': [m.removesuffix('.sql') for m in migrations if destructive(m)],
          }
          pathlib.Path('manifest.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY
      - name: 发布（先传成品，最后传清单，DMIT 以清单为准）
        if: env.SKIP != '1'
        run: |
          # GitHub 接口偶尔返回 5xx（2026-11-05 遇到过），每步最多试 5 次
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "第 $i 次失败，10 秒后重试：$*"; sleep 10; done; return 1; }
          git tag -f main-latest "$SHA"
          retry git push -f origin refs/tags/main-latest
          if ! gh release view main-latest >/dev/null 2>&1; then
            retry gh release create main-latest --prerelease --title "main-latest" --notes "main 上 CI 通过的最新构建，DMIT 自动拉取部署。提交和哈希见 manifest.json。"
          fi
          retry gh release upload main-latest lingshu --clobber
          retry gh release upload main-latest manifest.json --clobber
