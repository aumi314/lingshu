# PR 和推送到 main 都跑全部检查；main 上通过后由 release.yml 构建发布（见 docs/decisions.md「CI 与自动发布」）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一个 PR 推了新提交，就取消还在跑的上一轮
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go 测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lingshu
          POSTGRES_PASSWORD: lingshu_dev
          POSTGRES_DB: lingshu_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U lingshu"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 格式检查
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal; echo '上面的文件需要 gofmt'; exit 1)
      - name: go vet
        run: go vet ./...
      - name: 全量测试（测试会重建测试库的 public schema）
        env:
          LINGSHU_TEST_DATABASE_URL: postgres://lingshu:lingshu_dev@127.0.0.1:55432/lingshu_test?sslmode=disable
        run: go test -count=1 -p 1 ./...

  web:
    name: 前端检查与浏览器回归
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: 类型检查与构建
        run: npm run build
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.60.0-chromium-headless-shell
      - name: 安装浏览器回归用的 Playwright（只在 CI 里装，不进依赖）
        # 不加 --with-deps：系统依赖走 apt，GitHub 上 apt 源时快时慢（曾卡 10 分钟以上），镜像自带的依赖已够用
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.60.0
          npx playwright install chromium-headless-shell
      - name: 浏览器回归
        run: |
          node tests/overview.browser.cjs
          node tests/activity-logs.browser.cjs
          node tests/users.browser.cjs
          node tests/models.browser.cjs
          node tests/redeem.browser.cjs
          node tests/channels.browser.cjs
