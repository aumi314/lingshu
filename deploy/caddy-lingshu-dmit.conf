# 追加到 DMIT /opt/newapi/Caddyfile；沿用全局 Cloudflare trusted_proxies。
gateway.piqode.com {
  log {
    output file /var/log/caddy/lingshu-access.log {
      roll_size 10MiB
      roll_keep 7
    }
    format json
  }
  reverse_proxy 172.18.0.1:8300 {
    flush_interval -1
    header_up X-Real-IP {client_ip}
  }
}
