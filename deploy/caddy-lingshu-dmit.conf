# 追加到 DMIT /opt/newapi/Caddyfile；全局 trusted_proxies 使用相同 Cloudflare 网段。
# 官方网段核对于 2026-11-09：https://www.cloudflare.com/ips-v4 和 /ips-v6。
# 只限制本域名的 HTTP 请求；Caddy 自动证书挑战先于用户路由处理。
gateway.piqode.com {
  log {
    output file /var/log/caddy/lingshu-access.log {
      roll_size 10MiB
      roll_keep 7
    }
    format json
  }
  route {
    header {
      Strict-Transport-Security "max-age=31536000"
      X-Content-Type-Options "nosniff"
      Referrer-Policy "strict-origin-when-cross-origin"
      X-Frame-Options "DENY"
      Content-Security-Policy "frame-ancestors 'none'"
    }

    # remote_ip 是连接来源，不能换成受转发头影响的 client_ip。
    @not_cloudflare not remote_ip 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
    respond @not_cloudflare 403

    @blocked_scanners path /.DS_Store /wp-login.php /xmlrpc.php /wp-admin* /wordpress* /phpmyadmin* /pma* /boaform/* /HNAP1 /vendor/phpunit* /cgi-bin/* /actuator* /server-status /solr* /manager/html
    respond @blocked_scanners 404
    @sensitive path_regexp lingshu_sensitive (?i)(^|/)(\.env[^/]*|env\.[^/]*|\.git(/|$)|\.svn(/|$)|\.hg(/|$)|\.ssh(/|$)|\.aws(/|$)|\.npmrc$)
    respond @sensitive 404

    reverse_proxy 172.18.0.1:8300 {
      flush_interval -1
      header_up X-Real-IP {client_ip}
    }
  }
}
