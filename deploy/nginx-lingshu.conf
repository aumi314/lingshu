# 灵枢的 Nginx 站点。安装位置 /etc/nginx/conf.d/lingshu.conf，共用部分在 /etc/nginx/lingshu-common.inc。
#
# 两个域名指向同一个服务：
#   lingshu.piqode.com     中国境内访问正常；从境外访问时 TLS 握手会被按域名断开（2026-10-18 实测）
#   lingshu.focuskeeper.cn 已备案，境内外都能访问
# 两个域名各用一张证书，境外访问 focuskeeper 时握手里不出现 piqode。
# 证书和服务器上其他站点一样走 webroot：
#   certbot certonly --webroot -w /var/www/letsencrypt -d <域名>

server {
    listen 80;
    listen [::]:80;
    server_name lingshu.piqode.com lingshu.focuskeeper.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lingshu.focuskeeper.cn;
    ssl_certificate /etc/letsencrypt/live/lingshu.focuskeeper.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lingshu.focuskeeper.cn/privkey.pem;
    include /etc/nginx/lingshu-common.inc;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lingshu.piqode.com;
    ssl_certificate /etc/letsencrypt/live/lingshu.piqode.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lingshu.piqode.com/privkey.pem;
    include /etc/nginx/lingshu-common.inc;
}
