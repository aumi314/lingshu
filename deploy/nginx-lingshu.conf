# 灵枢的 Nginx 站点。安装位置 /etc/nginx/conf.d/lingshu.conf
# 证书由 certbot 签发：certbot certonly --nginx -d lingshu.piqode.com

server {
    listen 80;
    listen [::]:80;
    server_name lingshu.piqode.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lingshu.piqode.com;

    ssl_certificate /etc/letsencrypt/live/lingshu.piqode.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lingshu.piqode.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 带图片的长上下文请求可能很大，和网关的上限一致
    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式输出：收到一块转一块，不攒包；推理模型可能很久才出第一个字
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
