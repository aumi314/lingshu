# DMIT 独立副本；密钥在 /etc/lingshu/postgres.env，不进入仓库。
services:
  postgres:
    image: postgres@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    container_name: lingshu-postgres
    restart: unless-stopped
    env_file: /etc/lingshu/postgres.env
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - lingshu_pg_data:/var/lib/postgresql
    mem_limit: 256m
    cpus: 0.5
    shm_size: 64m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "work_mem=2MB", "-c", "max_connections=30", "-c", "effective_cache_size=128MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingshu -d lingshu"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  lingshu_pg_data:
